video:
  width: 1920
  height: 1080
  fps: 30

background:
  type: solid
  color: "#FFFFFF"

texts:
  - content: "Depth Effect Demo"
    start_time: 0.0
    fade_in_duration: 2.0
    display_duration: 2.0
    fade_out_duration: 2.0

    font:
      family: Georgia
      size: 120
      color: "#000000"

    position:
      mode: center

    effects:
      scale:
        enabled: true
        initial_scale: 0.5
        apply_to_fade_out: true
        easing: ease_in_out
      depth_of_field:
        enabled: true
        initial_distance: 0.8
        inward_frames: 30
        crisp_frames: 60
        outward_frames: 30
        blur_sigma: 0.2
        blur_max_radius: 25
        alpha_sigma: 0.2
        alpha_min: 0.3

    fade_out_duration: 2.0

    font:
      family: Georgia
      size: 96
      color: "#1A1A1A"

    position:
      mode: center

    effects:
      scale:
        enabled: true
        initial_scale: 0.5
        apply_to_fade_out: true
        easing: ease_out
      drop_shadow:
        enabled: true
        offset_x: 3
        offset_y: 3
        blur_radius: 3

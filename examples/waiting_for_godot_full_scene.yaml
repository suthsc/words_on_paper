# Waiting for Godot (full scene), written with cascading styles.
#
# Settings cascade lowest to highest:
#   built-in defaults < `defaults` < styles listed on the text (in order) < inline fields
# Nested blocks (font, position, effects.*) merge key by key, so a text can
# override just `font.size` and keep the style's family and color.
# Run `words-on-paper validate --resolved <file>` to see the expanded texts.

video:
  width: 1920
  height: 1080
  fps: 30

background:
  type: paper
  color: '#D9D9D9'
  texture_intensity: 0.1

defaults:
  fade_in_duration: 1.0
  display_duration: 3.0
  fade_out_duration: 1.0
  font:
    family: Georgia
  position:
    mode: center
  z_index: 15

styles:
  # --- Characters: a "voice" (color, size) and a stage mark (Courier, position)
  vladimir_voice:
    font: {color: "#1A5490", size: 42}
  vladimir:
    extends: vladimir_voice
    font: {family: Courier}
    position: {mode: relative, x: 0.15, y: 0.25}

  estragon_voice:
    font: {color: "#8B4513", size: 42}
  estragon:
    extends: estragon_voice
    font: {family: Courier}
    position: {mode: relative, x: 0.65, y: 0.45}

  # --- Everything that isn't dialogue
  stage_direction:
    font: {size: 36, color: "#95A5A6"}
    z_index: 14
  aside:
    font: {size: 32, color: "#BDC3C7"}
    z_index: 14
  pause:
    extends: aside
    content: "(Pause)"
    fade_in_duration: 0.5
    display_duration: 1.5
    fade_out_duration: 0.5
  narration:
    font: {color: "#34495E"}

  # --- Reusable effects, mixed in after a character/kind style
  shadow:
    effects:
      drop_shadow: {offset_x: 3, offset_y: 3, blur_radius: 3, color: "#00000040"}
  perspective:
    effects:
      letter_spacing:
        enabled: true
        center_spacing: true
        initial_spacing: 1.0
        target_spacing: 0.88

texts:
  # ===== OPENING SEQUENCE (12s) =====
  - content: Waiting for Godot
    fade_in_duration: 2.0
    fade_out_duration: 2.0
    font: {size: 96, color: '#1A1A1A'}
    effects:
      drop_shadow: {offset_x: 3, offset_y: 3, color: '#00000050'}
      scale: {enabled: true, easing: ease_out}
    z_index: 20
  - content: A Play in Two Acts
    start_time: 7.0
    display_duration: 2.0
    font: {size: 48, color: '#555555'}
    z_index: 19
  - content: By Samuel Beckett
    start_time: 11.0
    display_duration: 2.0
    font: {size: 42, color: '#777777'}
    z_index: 19

  # ===== SCENE SETTING (8s) =====
  - content: Act I, Scene 1
    start_time: 14.0
    display_duration: 2.0
    font: {color: '#2C3E50'}
    z_index: 18
  - content: A country road. A tree. Evening. The sun is low on the horizon.
    start_time: 18.0
    font: {size: 44, color: '#7F8C8D'}
    z_index: 18

  # ===== PART 1: OPENING EXCHANGE (25s) =====
  - style: vladimir
    content: 'VLADIMIR: Nothing to be done.'
    start_time: 22.0
    fade_in_duration: 0.8
    fade_out_duration: 0.8
    font: {size: 44}
    effects:
      drop_shadow: {blur_radius: 2, color: '#00000030'}
  - style: stage_direction
    content: (He beats his boots against the ground)
    start_time: 25.8
    fade_in_duration: 0.5
    display_duration: 2.0
    fade_out_duration: 0.5
    position: {mode: relative, x: 0.15, y: 0.35}
  - style: estragon
    content: 'ESTRAGON: I''m beginning to come round to that opinion.'
    start_time: 28.3
    fade_in_duration: 0.8
    fade_out_duration: 0.8
    font: {size: 44}
    effects:
      drop_shadow: {blur_radius: 2, color: '#00000030'}
  - style: stage_direction
    content: (He tries to pull off his boots)
    start_time: 32.1
    fade_in_duration: 0.5
    display_duration: 2.0
    fade_out_duration: 0.5
    position: {mode: relative, x: 0.65, y: 0.55}
  - style: pause
    start_time: 34.6

  # ===== PART 2: WHERE HAVE YOU BEEN (18s) =====
  - style: vladimir
    content: 'VLADIMIR: You''ve been here all the time?'
    start_time: 36.6
    fade_in_duration: 0.6
    display_duration: 2.5
    fade_out_duration: 0.6
  - style: estragon
    content: 'ESTRAGON: Where else would I be?'
    start_time: 39.7
    fade_in_duration: 0.6
    display_duration: 2.5
    fade_out_duration: 0.6
  - style: vladimir
    content: 'VLADIMIR: Quite right.'
    start_time: 42.8
    fade_in_duration: 0.6
    display_duration: 2.0
    fade_out_duration: 0.6
  - style: pause
    start_time: 45.4

  # ===== PART 3: KEEPING THE APPOINTMENT (22s) =====
  - style: [estragon_voice, perspective]
    content: 'ESTRAGON: We are not saints, but we have kept our appointment.'
    start_time: 47.4
    fade_in_duration: 0.8
    fade_out_duration: 0.8
    font: {size: 46}
    position: {mode: relative, x: 0.65, y: 0.5}
    effects:
      drop_shadow: {blur_radius: 2}
      letter_spacing: {target_spacing: 0.85}
  - style: estragon_voice
    content: How unlike us.
    start_time: 51.6
    fade_in_duration: 0.6
    display_duration: 2.5
    fade_out_duration: 0.6
    position: {mode: relative, x: 0.65, y: 0.6}
  - style: vladimir_voice
    content: 'VLADIMIR: You mentioned nothing... during the time we were apart?'
    start_time: 54.7
    fade_in_duration: 0.8
    fade_out_duration: 0.8
    position: {mode: relative, x: 0.15, y: 0.3}
  - style: pause
    start_time: 58.5

  # ===== PART 4: THE CENTRAL QUESTION (30s) =====
  - style: [vladimir_voice, shadow, perspective]
    content: 'VLADIMIR: And if he doesn''t come?'
    start_time: 60.5
    display_duration: 3.5
    font: {size: 52}
    position: {mode: relative, x: 0.15, y: 0.3}
  - style: [estragon_voice, shadow, perspective]
    content: 'ESTRAGON: We''ll come back tomorrow.'
    start_time: 65.0
    font: {size: 52}
    position: {mode: relative, x: 0.65, y: 0.5}
  - style: vladimir_voice
    content: And the day after tomorrow...
    start_time: 69.0
    fade_in_duration: 0.8
    fade_out_duration: 0.8
    font: {size: 48}
    position: {mode: relative, x: 0.15, y: 0.35}
  - style: [vladimir_voice, perspective]
    content: 'VLADIMIR: We are waiting for Godot.'
    start_time: 73.0
    display_duration: 3.5
    font: {size: 54}
    effects:
      letter_spacing: {initial_spacing: 0.98, target_spacing: 0.87}

  # ===== PART 5: PHILOSOPHICAL MOMENT (28s) =====
  - style: [narration, perspective]
    content: What are we doing here, that is the question.
    start_time: 77.5
    font: {size: 50}
    effects:
      letter_spacing: {initial_spacing: 0.98, target_spacing: 0.86}
  - style: pause
    start_time: 81.5
  - style: [narration, perspective]
    content: And we are blessed in this, that we happen to know this.
    start_time: 83.5
    display_duration: 3.5
    font: {size: 48}
    effects:
      letter_spacing: {initial_spacing: 0.98, target_spacing: 0.86}
  - style: narration
    content: But for the moment we are here, where we are waiting.
    start_time: 88.0
    font: {size: 46}
  - style: pause
    start_time: 92.0

  # ===== PART 6: DECISION AND ACTION (25s) =====
  - style: vladimir
    content: 'VLADIMIR: What do you think?'
    start_time: 94.0
    fade_in_duration: 0.7
    display_duration: 2.5
    fade_out_duration: 0.7
  - style: estragon
    content: 'ESTRAGON: I think we are here.'
    start_time: 97.2
    fade_in_duration: 0.7
    display_duration: 2.5
    fade_out_duration: 0.7
  - style: vladimir_voice
    content: 'VLADIMIR: Yes, but who is waiting for whom?'
    start_time: 100.4
    fade_in_duration: 0.7
    display_duration: 2.5
    fade_out_duration: 0.7
  - style: estragon_voice
    content: 'ESTRAGON: We are here. That is enough.'
    start_time: 103.6
    fade_in_duration: 0.7
    display_duration: 2.5
    fade_out_duration: 0.7
  - style: [vladimir_voice, shadow]
    content: 'VLADIMIR: Yes. Yes, let''s go.'
    start_time: 106.8
    fade_in_duration: 0.8
    display_duration: 2.5
    fade_out_duration: 0.8
    font: {size: 48}
    position: {mode: relative, x: 0.2, y: 0.35}
  - style: [estragon_voice, shadow]
    content: 'ESTRAGON: Yes, let''s go.'
    start_time: 110.1
    fade_in_duration: 0.8
    display_duration: 2.5
    fade_out_duration: 0.8
    font: {size: 48}
    position: {mode: relative, x: 0.6, y: 0.5}

  # ===== PART 7: THE PARADOX (15s) =====
  - style: stage_direction
    content: (They do not move.)
    start_time: 113.4
    display_duration: 3.5
    font: {size: 50}
    effects:
      scale: {enabled: true, initial_scale: 0.85}
  - style: aside
    content: (The curtain slowly fades)
    start_time: 117.9
    display_duration: 2.5
    font: {size: 40}
    z_index: 13

  # ===== FINAL MEDITATION (30s) =====
  - style: perspective
    content: In the beginning...
    start_time: 121.4
    fade_in_duration: 1.2
    display_duration: 2.5
    fade_out_duration: 1.2
    font: {size: 56, color: '#7F8C8D'}
    effects:
      letter_spacing: {initial_spacing: 1.05, target_spacing: 0.9}
  - style: narration
    content: There is nothing to be done.
    start_time: 125.1
    font: {size: 54}
  - style: [narration, perspective]
    content: Waiting for Godot...
    start_time: 130.1
    fade_in_duration: 2.0
    display_duration: 4.0
    fade_out_duration: 2.0
    effects:
      drop_shadow: {offset_x: 4, offset_y: 4, blur_radius: 4, color: '#00000050'}
      letter_spacing: {target_spacing: 0.87}
      depth_of_field: {enabled: true, initial_distance: 0.4, inward_frames: 60, crisp_frames: 90, outward_frames: 60, blur_sigma: 0.25, alpha_sigma: 0.18, alpha_min: 0.35}

  # ===== CLOSING (10s) =====
  - content: THE END
    start_time: 138.1
    fade_out_duration: 2.0
    font: {size: 80, color: '#2C3E50'}
    effects:
      drop_shadow: {offset_x: 4, offset_y: 4, blur_radius: 4, color: '#00000060'}
      scale: {enabled: true, initial_scale: 0.3, easing: ease_out}
    z_index: 20

video:
  width: 1920
  height: 1080
  fps: 30

background:
  type: paper
  color: "#D9D9D9"
  texture_intensity: 0.1

texts:
  # ===== OPENING SEQUENCE (12s) =====
  - content: "Waiting for Godot"

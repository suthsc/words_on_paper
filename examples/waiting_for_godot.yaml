video:
  width: 1920
  height: 1080
  fps: 30

background:
  type: paper
  color: "#E8E8E8"
  texture_intensity: 0.08

texts:
  # Scene title
  - content: "Waiting for Godot"
    start_time: 0.0
    fade_in_duration: 1.0
    display_duration: 2.0
    fade_out_duration: 1.0

    font:
      family: Georgia
      size: 96
      color: "#2C3E50"

    position:
      mode: center

    effects:
      scale:
        enabled: true
        initial_scale: 0.6
        apply_to_fade_out: true
        easing: ease_out

    z_index: 10

  # Scene description
  - content: "A country road. A tree. Evening."
    start_time: 3.5
    fade_in_duration: 1.0
    display_duration: 2.0
    fade_out_duration: 1.0

    font:
      family: Georgia
      size: 48
      color: "#7F8C8D"

    position:
      mode: center

    z_index: 9

  # Vladimir's first line - positioned left
  - content: "VLADIMIR: Nothing to be done."
    start_time: 5.5
    fade_in_duration: 0.8
    display_duration: 2.5
    fade_out_duration: 0.8

    font:
      family: Courier
      size: 42
      color: "#1A5490"

    position:
      mode: relative
      x: 0.2
      y: 0.3

    effects:
      drop_shadow:
        enabled: true
        offset_x: 2
        offset_y: 2
        blur_radius: 2
        color: "#00000030"

    z_index: 8

  # Estragon's response - positioned right
  - content: "ESTRAGON: I'm beginning to come round to that opinion."
    start_time: 8.0
    fade_in_duration: 0.8
    display_duration: 2.5
    fade_out_duration: 0.8

    font:
      family: Courier
      size: 42
      color: "#8B4513"

    position:
      mode: relative
      x: 0.6
      y: 0.5

    effects:
      drop_shadow:
        enabled: true
        offset_x: 2
        offset_y: 2
        blur_radius: 2
        color: "#00000030"

    z_index: 8

  # Vladimir's philosophical line with centered spacing
  - content: "We are waiting for Godot."
    start_time: 10.5
    fade_in_duration: 1.0
    display_duration: 3.0
    fade_out_duration: 1.0

    font:
      family: Georgia
      size: 52
      color: "#1A5490"

    position:
      mode: relative
      x: 0.15
      y: 0.65

    effects:
      letter_spacing:
        enabled: true
        initial_spacing: 1.0
        target_spacing: 0.85
        center_spacing: true
        apply_to_fade_out: true
        easing: ease_in_out
      drop_shadow:
        enabled: true
        offset_x: 3
        offset_y: 3
        blur_radius: 3
        color: "#00000040"

    z_index: 8

  # Estragon's skeptical response with centered spacing
  - content: "And if he doesn't come?"
    start_time: 13.5
    fade_in_duration: 1.0
    display_duration: 2.5
    fade_out_duration: 1.0

    font:
      family: Georgia
      size: 52
      color: "#8B4513"

    position:
      mode: relative
      x: 0.55
      y: 0.7

    effects:
      letter_spacing:
        enabled: true
        initial_spacing: 1.0
        target_spacing: 0.82
        center_spacing: true
        apply_to_fade_out: true
        easing: ease_in_out
      drop_shadow:
        enabled: true
        offset_x: 3
        offset_y: 3
        blur_radius: 3
        color: "#00000040"

    z_index: 8

  # Vladimir's resigned response
  - content: "VLADIMIR: We'll come back tomorrow."
    start_time: 16.0
    fade_in_duration: 0.8
    display_duration: 2.0
    fade_out_duration: 0.8

    font:
      family: Courier
      size: 40
      color: "#1A5490"

    position:
      mode: relative
      x: 0.2
      y: 0.3

    z_index: 7

  # Estragon agrees
  - content: "ESTRAGON: Yes, let's go."
    start_time: 18.0
    fade_in_duration: 0.8
    display_duration: 2.0
    fade_out_duration: 0.8

    font:
      family: Courier
      size: 40
      color: "#8B4513"

    position:
      mode: relative
      x: 0.6
      y: 0.5

    z_index: 7

  # Stage direction
  - content: "(They do not move.)"
    start_time: 20.0
    fade_in_duration: 0.8
    display_duration: 2.0
    fade_out_duration: 0.8

    font:
      family: Georgia
      size: 36
      color: "#95A5A6"

    position:
      mode: center

    effects:
      scale:
        enabled: true
        initial_scale: 0.8
        apply_to_fade_out: true
        easing: ease_in_out

    z_index: 6

  # Final philosophical line with depth effect
  - content: "Waiting for Godot..."
    start_time: 22.0
    fade_in_duration: 1.5
    display_duration: 3.0
    fade_out_duration: 1.5

    font:
      family: Georgia
      size: 64
      color: "#34495E"

    position:
      mode: center

    effects:
      letter_spacing:
        enabled: true
        initial_spacing: 0.95
        target_spacing: 0.88
        center_spacing: true
        apply_to_fade_out: true
        easing: ease_in_out
      depth_of_field:
        enabled: true
        initial_distance: 0.5
        inward_frames: 45
        crisp_frames: 90
        outward_frames: 45
        blur_sigma: 0.2
        blur_max_radius: 20
        alpha_sigma: 0.15
        alpha_min: 0.4
      drop_shadow:
        enabled: true
        offset_x: 4
        offset_y: 4
        blur_radius: 4
        color: "#00000050"

    z_index: 5

  # End curtain
  - content: "THE END"
    start_time: 26.0
    fade_in_duration: 1.0
    display_duration: 2.0
    fade_out_duration: 1.5

    font:
      family: Georgia
      size: 80
      color: "#2C3E50"

    position:
      mode: center

    effects:
      scale:
        enabled: true
        initial_scale: 0.4
        apply_to_fade_out: true
        easing: ease_in_out

    z_index: 10
